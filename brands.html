<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#000000">
<title>Бренды — FASHION AVENUE, Омск</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
/* ═════ СТРАНИЦА БРЕНДОВ ═════ */
.brands-main{max-width:1600px;margin:0 auto;padding:calc(106px + 24px) 12px 60px}
.brands-main h1{font-size:22px;font-weight:700;margin-bottom:18px;text-transform:uppercase;letter-spacing:.05em}
#brandSearch{width:100%;max-width:480px;padding:14px 18px;margin-bottom:32px;border:1px solid var(--line);
  border-radius:0;font-family:var(--ff);font-size:15px;outline:none;background:var(--bg);transition:border-color .2s}
#brandSearch:focus{border-color:var(--graphite)}
@media(min-width:900px){
  .brands-main{padding:calc(118px + 40px) 24px 80px}
  .brands-main h1{font-size:28px;margin-bottom:24px}
}

/* топ-бренды: плитки с фото */
.top-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:8px 0 14px}
.brgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px;margin-bottom:40px}
.tb{display:block;color:inherit}
.tb-photo{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--soft);
  display:flex;align-items:center;justify-content:center}
.tb-photo>img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.tb:hover .tb-photo>img{transform:scale(1.04)}
.tb-ph{font-size:clamp(18px,2.4vw,28px);overflow-wrap:anywhere;font-weight:300;letter-spacing:.06em;color:rgba(255,255,255,.85);text-align:center;padding:0 8px;line-height:1.1}
.tb-logo{position:absolute;left:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tb-logo img{width:70%;height:70%;object-fit:contain}
.tb-logo span{font-size:13px;font-weight:700;color:var(--graphite)}
.tb-name{margin-top:10px;font-size:13px;font-weight:500;line-height:1.3}
@media(min-width:600px){.brgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 14px}}
@media(min-width:900px){.brgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 16px}.tb-logo{width:48px;height:48px}}

/* список «Все бренды» */
.brands-list{margin-top:64px}
.brands-list-title{font-size:17px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  text-align:center;margin-bottom:28px;color:var(--red)}
.brands-alpha{font-size:15px;font-weight:500;text-transform:uppercase;text-align:center;margin:28px 0 12px;color:var(--red)}
.brands-grid{display:grid;grid-template-columns:1fr;column-gap:40px}
.brand-item{display:flex;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.brand-fav{width:24px;height:24px;display:grid;place-items:center;margin-right:16px;flex-shrink:0;
  color:var(--graphite);transition:opacity .2s}
.brand-fav:hover{opacity:.6}
.brand-fav.on svg{fill:var(--red);stroke:var(--red)}
.brand-link{flex:1;font-size:15px;letter-spacing:.02em;text-transform:uppercase;transition:opacity .2s}
.brand-link:hover{opacity:.6}
.brands-empty{text-align:center;color:var(--muted);padding:32px 0}
@media(min-width:768px){.brands-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.brands-list-title{font-size:22px}}

</style>
</head>
<body>

<script src="assets/site.js"></script>

<main class="brands-main">
  <h1>Бренды</h1>
  <input type="text" id="brandSearch" placeholder="Поиск бренда (например: Diesel)..." autocomplete="off">

  <!-- топ-бренды -->
  <section id="topBrands">
    <h2 class="top-title">Топ бренды</h2>
    <div class="brgrid" id="brandsGrid"></div>
  </section>

  <!-- список «Все бренды» -->
  <section class="brands-list">
    <h2 class="brands-list-title" id="brandsListTitle">Все бренды</h2>
    <div id="brandsList"></div>
  </section>
</main>

<div data-site-footer></div>

<script>
/* ───── БРЕНДЫ ПО ПОЛУ ───── */
const BRANDS_BY_GENDER={
  men:[
    "Aeronautica Militare","BLCV","Bogner","Bosideng","Daniele Fiesoli","Diesel","Digel",
    "Doucal's","Emporio Armani","ICE Play","JNBY","Karl Lagerfeld","Limitato","Odri",
    "Seventy","TRANSIT"
  ],
  women:[
    "Aeronautica Militare","Alma en Pena","Alysi","Annette Görtz","Beatrice.b","Biancalancia",
    "BLCV","Bogner","By Malene Birger","Canadian","Charmline","D.Exterior","Diego M","Diesel",
    "Dorothee Schumacher","Doucal's","Elena Iachi","Eleventy","Emporio Armani","ICE Play","JNBY",
    "Karl Lagerfeld","Le Coeur TWINSET","Lidea","Limitato","Liu Jo","Luisa Cerano",
    "Marina Rinaldi","Maryan Mehlhorn","Max Mara Leisure","MAX&MOI","Miss Sixty","MSGM","Nissa",
    "One Teaspoon","OSKA","Persona by Marina Rinaldi","Pinko","Plinio Visona","Secrets",
    "Seventy","Sfizio","Stefanel","TRANSIT","Uvelina","Watercult"
  ]
};
let gender='women';
const favBrands=new Set();
const HEART='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20s-7-4.6-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7 2.7C19 15.4 12 20 12 20z"/></svg>';
const esc=s=>s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

/* ───── ТОП-БРЕНДЫ ─────
   Позже этот объект приходит из API (админка: бренд → «Топ», пол, порядок, фото, логотип).
   photo/logo — URL картинок. Пока null → показывается заглушка. */
const TOP_BRANDS={
  men:[
    {name:'Aeronautica Militare',photo:null,logo:null,hue:215},
    {name:'Hannes Roether',photo:null,logo:null,hue:25},
    {name:'Diesel',photo:null,logo:null,hue:5},
    {name:'Transit',photo:null,logo:null,hue:150},
    {name:'Bogner',photo:null,logo:null,hue:200}
  ],
  women:[
    {name:'Dorothee Schumacher',photo:null,logo:null,hue:330},
    {name:'Miss Sixty',photo:null,logo:null,hue:350},
    {name:'Annette Görtz',photo:null,logo:null,hue:30},
    {name:'D.Exterior',photo:null,logo:null,hue:170},
    {name:'Seventy',photo:null,logo:null,hue:260}
  ]
};
const initials=n=>n.split(/[\s.]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
/* ───── ДАННЫЕ ИЗ АДМИНКИ (API). Если API недоступен — остаются данные выше ───── */
const API_BASE='https://1c-dev.avenuefashion.online';   // адрес бэкенда (витринное API); '' — если сайт и API на одном домене
const abs=u=>u?(/^https?:\/\//.test(u)?u:API_BASE+u):null;  // API отдаёт абсолютные ссылки при заданном PUBLIC_BASE_URL
const BRAND_SLUG={};   // имя бренда → адрес страницы (приходит из API)
const brandHref=n=>BRAND_SLUG[n]?'brand.html?slug='+encodeURIComponent(BRAND_SLUG[n]):null;
const hueOf=n=>[...n].reduce((h,c)=>(h*31+c.charCodeAt(0))%360,7);
async function loadBrandsFromApi(g){
  try{
    const r=await fetch(API_BASE+'/api/brands?gender='+g);
    if(!r.ok)throw 0;
    const d=await r.json();
    BRANDS_BY_GENDER[g]=d.all.map(b=>b.name);
    d.all.concat(d.top).forEach(x=>{BRAND_SLUG[x.name]=x.slug});
    TOP_BRANDS[g]=d.top.map(t=>({name:t.name,slug:t.slug,hue:hueOf(t.name),
      photo:abs(t.photo),logo:abs(t.logo)}));
    if(g===gender){renderBrandList();renderTopBrands()}
  }catch(e){/* API недоступен — остаются встроенные данные */}
}
function renderTopBrands(){
  const term=document.getElementById('brandSearch').value.trim().toLowerCase();
  const items=TOP_BRANDS[gender].filter(b=>b.name.toLowerCase().includes(term));
  document.getElementById('topBrands').style.display=items.length?'':'none';
  document.getElementById('brandsGrid').innerHTML=items.map(b=>`
    <a href="${esc(brandHref(b.name)||'#')}" class="tb" data-name="${esc(b.name)}">
      <div class="tb-photo"${b.photo?'':` style="background:linear-gradient(145deg,hsl(${b.hue},18%,58%),hsl(${b.hue},22%,32%))"`}>
        ${b.photo?`<img src="${esc(b.photo)}" alt="${esc(b.name)}" loading="lazy">`:`<div class="tb-ph">${esc(b.name)}</div>`}
        <div class="tb-logo">${b.logo?`<img src="${esc(b.logo)}" alt="">`:`<span>${esc(initials(b.name))}</span>`}</div>
      </div>
      <div class="tb-name">${esc(b.name)}</div>
    </a>`).join('');
}
document.getElementById('brandsGrid').addEventListener('click',e=>{
  const c=e.target.closest('.tb');
  if(c&&!brandHref(c.dataset.name)){e.preventDefault();toast('Страница бренда '+c.dataset.name)}
});

function renderBrandList(){
  const f=document.getElementById('brandSearch').value.trim().toLowerCase();
  const list=BRANDS_BY_GENDER[gender]
    .filter(n=>n.toLowerCase().includes(f))
    .sort((a,b)=>a.localeCompare(b,'en',{sensitivity:'base'}));
  document.getElementById('brandsListTitle').textContent=
    'Все бренды · '+(gender==='men'?'мужское':'женское');
  const groups={};
  list.forEach(n=>(groups[n[0].toUpperCase()]??=[]).push(n));
  const html=Object.keys(groups).sort().map(l=>`
    <div class="brands-alpha">${l}</div>
    <div class="brands-grid">${groups[l].map(n=>`
      <div class="brand-item">
        <button class="brand-fav ${favBrands.has(gender+'|'+n)?'on':''}" aria-label="В избранное"
          data-key="${esc(gender+'|'+n)}">${HEART}</button>
        <a href="${esc(brandHref(n)||'#')}" class="brand-link" data-name="${esc(n)}">${esc(n)}</a>
      </div>`).join('')}
    </div>`).join('');
  document.getElementById('brandsList').innerHTML=
    html||'<p class="brands-empty">Ничего не найдено</p>';
}

/* делегирование кликов: избранное и переход на страницу бренда */
document.getElementById('brandsList').addEventListener('click',e=>{
  const fav=e.target.closest('.brand-fav');
  if(fav){
    const k=fav.dataset.key;
    favBrands.has(k)?favBrands.delete(k):favBrands.add(k);
    fav.classList.toggle('on');
    return;
  }
  const link=e.target.closest('.brand-link');
  if(link&&!brandHref(link.dataset.name)){e.preventDefault();toast('Страница бренда '+link.dataset.name)}
});

/* ───── ПЕРЕКЛЮЧАТЕЛЬ ПОЛА (шапка + меню синхронно) ───── */
function setGender(g,silent){
  gender=g;
  document.querySelectorAll('.gender button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(g==='men')));
  document.querySelectorAll('.mtabs button').forEach((b,i)=>{
    if(i<2)b.classList.toggle('on',(i===0)===(g==='women'));
  });
  document.querySelectorAll('.mtabs button')[2].classList.remove('on');
  renderBrandList();renderTopBrands();loadBrandsFromApi(g);
  if(!silent)toast(g==='men'?'Мужское — раздел переключён':'Женское — раздел переключён');
}
function sw(b){setGender(b.textContent.trim()==='Мужское'?'men':'women')}
function mtab(b){
  const t=b.textContent.trim();
  if(t==='Женщины')setGender('women');
  else if(t==='Мужчины')setGender('men');
  else{
    [...b.parentNode.children].forEach(x=>x.classList.remove('on'));
    b.classList.add('on');toast('Парфюмерия — раздел переключён');
  }
}

/* ───── ПОИСК: фильтрует логотипы и список ───── */
document.getElementById('brandSearch').addEventListener('input',e=>{
  const term=e.target.value.trim().toLowerCase();
  renderTopBrands();
  renderBrandList();
});


setGender('women',true);
</script>
</body>
</html>
