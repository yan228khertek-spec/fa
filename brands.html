<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бренды | FASHION AVENUE</title>
    <style>
        /* Базовые переменные из вашего index.html для единого стиля */
        :root {
            --bg: #ffffff;
            --tx: #1a1a1a;
            --line: #e5e5e5;
            --accent: #000000;
            --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            padding-top: 64px; /* Отступ под фиксированную шапку */
            font-family: var(--f);
            background: var(--bg);
            color: var(--tx);
            line-height: 1.5;
        }

        /* Шапка (упрощенная копия вашей для единообразия) */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: var(--bg); border-bottom: 1px solid var(--line);
            transition: transform 0.3s ease;
        }
        header.hidden { transform: translateY(-100%); }
        .bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; max-width: 1200px; margin: 0 auto; }
        .logo { font-size: 18px; font-weight: 700; text-decoration: none; color: var(--tx); text-transform: uppercase; letter-spacing: 1px; }
        .logo small { display: block; font-size: 10px; font-weight: 400; color: #666; letter-spacing: 0.5px; margin-top: 2px; }
        .back-link { text-decoration: none; color: var(--tx); font-size: 14px; display: flex; align-items: center; gap: 6px; }

        /* Основной контент страницы брендов */
        .brands-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px 80px;
        }

        .brands-title {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brands-search {
            width: 100%;
            max-width: 400px;
            padding: 14px 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 40px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .brands-search:focus {
            border-color: var(--tx);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .brand-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            text-decoration: none;
            color: var(--tx);
            transition: all 0.3s ease;
            background: var(--bg);
        }

        .brand-card:hover {
            border-color: var(--tx);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .brand-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 16px;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }

        .brand-card:hover .brand-logo {
            filter: grayscale(0%);
        }

        .brand-name {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Адаптив для мобильных */
        @media (max-width: 600px) {
            .brands-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .brand-card { padding: 16px 8px; }
            .brand-logo { width: 70px; height: 70px; }
            .brands-title { font-size: 24px; }
        }
    </style>
</head>

    <script>
        // 1. Скрипт живого поиска по брендам
        document.getElementById('brandSearch').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.brand-card').forEach(card => {
                const name = card.querySelector('.brand-name').textContent.toLowerCase();
                card.style.display = name.includes(term) ? 'flex' : 'none';
            });
        });

        // 2. Скрипт скрытия шапки при скролле (тот же, что и в index.html)
        (function(){
            const header = document.querySelector('header');
            let lastY = 0;
            window.addEventListener('scroll', () => {
                const y = window.scrollY;
                if (y > lastY && y > 80) header.classList.add('hidden');
                else if (y < lastY) header.classList.remove('hidden');
                if (y <= 0) header.classList.remove('hidden');
                lastY = y;
            }, { passive: true });
        })();
    </script>
