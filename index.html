<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
    <meta name="theme-color" content="#000000">
    <title>FASHION AVENUE — галерея моды, Омск</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === ВАШИ ПЕРЕМЕННЫЕ И БАЗОВЫЕ СТИЛИ === */
        :root{
            --graphite:#000000; --bg:#fff; --soft:#F2F1EF; --line:#E7E5E2;
            --line2:#CFCCC8; --muted:#8A8780; --accent:#A38768; --red:#C8452F;
            --ff:'Onest',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
            --sb:env(safe-area-inset-bottom,0px);
            --st:env(safe-area-inset-top,0px);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
        body{
            background:var(--bg);
            color:var(--graphite);
            font-family:var(--ff);
            font-size:15px;
            line-height:1.5;
            -webkit-font-smoothing:antialiased;
            -webkit-tap-highlight-color:rgba(0,0,0,.05);
            padding-top:64px; /* отступ под фиксированную шапку */
        }
        a{text-decoration:none;color:inherit}

        /* === ШАПКА (FIXED + СКРЫТИЕ ПРИ СКРОЛЛЕ) === */
        header{
            position:fixed; top:0; left:0; right:0;
            z-index:100; background:var(--bg);
            border-bottom:1px solid var(--line);
            transition:transform .3s ease;
        }
        header.hidden{transform:translateY(-100%)}
        .bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1200px;margin:0 auto}
        .logo{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
        .logo small{display:block;font-size:10px;font-weight:400;color:#666;letter-spacing:.5px;margin-top:2px}
        .icons{display:flex;gap:16px;align-items:center}
        .icons span{cursor:pointer;display:flex}

        /* === МЕНЮ (БУРГЕР) === */
        .menu{
            position:fixed; top:0; left:0; bottom:0;
            width:320px; background:#fff; z-index:96;
            flex-direction:column;
            transform:translateX(-100%);
            transition:transform .3s ease;
            box-shadow:4px 0 20px rgba(0,0,0,.1);
            display:none;
        }
        .menu.on{display:flex;transform:translateX(0)}
        .menu-overlay{
            position:fixed; inset:0; background:rgba(0,0,0,.4);
            z-index:95; opacity:0; visibility:hidden;
            transition:opacity .3s ease, visibility .3s;
        }
        .menu-overlay.on{opacity:1;visibility:visible}
        .mtop{display:flex;justify-content:flex-end;padding:16px}
        .mtop button{background:none;border:none;font-size:24px;cursor:pointer}
        .mscroll{padding:20px;overflow-y:auto;flex:1}
        .mlink{display:block;padding:14px 0;font-size:15px;border-bottom:1px solid var(--line)}

        /* === ФУТЕР === */
        footer{border-top:1px solid var(--line);margin-top:44px;padding:30px 0 calc(34px + var(--sb));font-size:13px}
        .fg{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1200px;margin:0 auto;padding:0 20px}
        footer b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:11px}
        footer a,footer p{display:block;color:var(--muted);margin-bottom:8px}
        footer a:hover{color:var(--graphite)}
        .footer-bottom{max-width:1200px;margin:20px auto 0;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:#888;text-align:center;padding:20px}

        /* === ТОСТ === */
        .toast{
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(60px);
            background:var(--graphite); color:#fff; padding:12px 20px; border-radius:8px;
            font-size:14px; z-index:200; opacity:0; transition:all .3s ease;
            max-width:90%;
        }
        .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

        /* === АДАПТИВ === */
        @media(min-width:900px){
            .fg{grid-template-columns:repeat(4,1fr)}
            .mscroll{max-width:760px;margin:0 auto;width:100%}
        }
    </style>
</head>
<body>

    <!-- ПЛЕЙСХОЛДЕРЫ ДЛЯ HEADER И FOOTER -->
    <div id="header-placeholder"></div>

    <!-- ОСНОВНОЙ КОНТЕНТ СТРАНИЦЫ -->
    <main>
        <section style="max-width:1200px;margin:0 auto;padding:40px 20px;">
            <h1 style="font-size:28px;font-weight:700;margin-bottom:20px;text-transform:uppercase;">Новые поступления</h1>
            <p>Здесь будет ваш каталог товаров.</p>
            <!-- Вставьте сюда остальной контент главной страницы -->
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- ТОСТ-УВЕДОМЛЕНИЕ -->
    <div class="toast" id="toast"></div>

    <!-- СКРИПТЫ -->
    <script>
    /* === ЗАГРУЗКА HEADER И FOOTER === */
    async function loadPartials() {
        try {
            const [headerRes, footerRes] = await Promise.all([
                fetch('header.html'),
                fetch('footer.html')
            ]);

            if (!headerRes.ok || !footerRes.ok) throw new Error('Файлы не найдены');

            const headerHTML = await headerRes.text();
            const footerHTML = await footerRes.text();

            document.getElementById('header-placeholder').innerHTML = headerHTML;
            document.getElementById('footer-placeholder').innerHTML = footerHTML;

            // После вставки — запускаем инициализацию
            initAfterLoad();
        } catch (e) {
            console.error('Ошибка загрузки шапки/подвала:', e);
            document.getElementById('header-placeholder').innerHTML = '<p style="color:red;padding:20px;">Ошибка: не удалось загрузить header.html и footer.html. Откройте сайт через Live Server.</p>';
        }
    }

    /* === ОБЩИЕ ФУНКЦИИ === */
    function openMenu() {
        const menu = document.getElementById('menu');
        const overlay = document.getElementById('menuOverlay');
        if (menu) menu.classList.add('on');
        if (overlay) overlay.classList.add('on');
        document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
        const menu = document.getElementById('menu');
        const overlay = document.getElementById('menuOverlay');
        if (menu) menu.classList.remove('on');
        if (overlay) overlay.classList.remove('on');
        document.body.style.overflow = '';
    }

    function toast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('on');
        setTimeout(() => t.classList.remove('on'), 2000);
    }

    /* === ИНИЦИАЛИЗАЦИЯ ПОСЛЕ ЗАГРУЗКИ ЧАСТЕЙ === */
    function initAfterLoad() {
        // Скрытие шапки при скролле вниз
        const header = document.querySelector('header');
        if (header) {
            let lastY = 0;
            window.addEventListener('scroll', () => {
                const y = window.scrollY;
                if (y > lastY && y > 80) header.classList.add('hidden');
                else if (y < lastY) header.classList.remove('hidden');
                if (y <= 0) header.classList.remove('hidden');
                lastY = y;
            }, { passive: true });
        }
    }

    // Запускаем загрузку
    loadPartials();
    </script>
</body>
</html>
