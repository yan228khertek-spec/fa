<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
    <meta name="theme-color" content="#000000">
    <title>FASHION AVENUE — галерея моды, Омск</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --graphite:#000000; --bg:#fff; --soft:#F2F1EF; --line:#E7E5E2;
            --line2:#CFCCC8; --muted:#8A8780; --accent:#A38768; --red:#C8452F;
            --ff:'Onest',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
            --sb:env(safe-area-inset-bottom,0px);
            --st:env(safe-area-inset-top,0px);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
        body{
            background:var(--bg);
            color:var(--graphite);
            font-family:var(--ff);
            font-size:15px;
            line-height:1.5;
            -webkit-font-smoothing:antialiased;
            -webkit-tap-highlight-color:rgba(0,0,0,.05);
            padding-top:64px;
        }
        a{text-decoration:none;color:inherit}

        header{
            position:fixed; top:0; left:0; right:0;
            z-index:100; background:var(--bg);
            border-bottom:1px solid var(--line);
            transition:transform .3s ease;
        }
        header.hidden{transform:translateY(-100%)}
        .bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1200px;margin:0 auto}
        .logo{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
        .logo small{display:block;font-size:10px;font-weight:400;color:#666;letter-spacing:.5px;margin-top:2px}
        .icons{display:flex;gap:16px;align-items:center}
        .icons span{cursor:pointer;display:flex}
        .burger{background:none;border:none;cursor:pointer;padding:4px;display:flex}

        .menu{
            position:fixed; top:0; left:0; bottom:0;
            width:320px; background:#fff; z-index:96;
            flex-direction:column;
            transform:translateX(-100%);
            transition:transform .3s ease;
            box-shadow:4px 0 20px rgba(0,0,0,.1);
            display:none;
        }
        .menu.on{display:flex;transform:translateX(0)}
        .menu-overlay{
            position:fixed; inset:0; background:rgba(0,0,0,.4);
            z-index:95; opacity:0; visibility:hidden;
            transition:opacity .3s ease, visibility .3s;
        }
        .menu-overlay.on{opacity:1;visibility:visible}
        .mtop{display:flex;justify-content:flex-end;padding:16px}
        .mtop button{background:none;border:none;font-size:24px;cursor:pointer}
        .mscroll{padding:20px;overflow-y:auto;flex:1}
        .mlink{display:block;padding:14px 0;font-size:15px;border-bottom:1px solid var(--line)}

        .hero{position:relative;overflow:hidden;margin-bottom:24px}
        .slides{display:flex;transition:transform .6s ease}
        .slide{min-width:100%;aspect-ratio:16/9;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;text-transform:uppercase}
        .dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
        .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);border:none;cursor:pointer}
        .dot.on{background:#fff}

        .gender-toggle{display:flex;max-width:1200px;margin:0 auto 24px;padding:0 20px;border-bottom:1px solid var(--line)}
        .gender-toggle button{flex:1;padding:14px;background:none;border:none;border-bottom:2px solid transparent;font-family:var(--ff);font-size:15px;font-weight:500;cursor:pointer;color:var(--muted)}
        .gender-toggle button.on{color:var(--graphite);border-bottom-color:var(--graphite)}

        .section{max-width:1200px;margin:0 auto 40px;padding:0 20px}
        .section h2{font-size:22px;font-weight:700;margin-bottom:20px;text-transform:uppercase;letter-spacing:.05em}
        .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
        @media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
        .card{display:flex;flex-direction:column;gap:8px}
        .pic{aspect-ratio:3/4;background:var(--soft);border-radius:8px;overflow:hidden;position:relative;cursor:pointer}
        .pic img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
        .pic:hover img{transform:scale(1.05)}
        .card-info{display:flex;flex-direction:column;gap:4px}
        .card-name{font-size:14px;font-weight:500}
        .card-price{font-size:14px;color:var(--muted)}
        .szs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
        .szs button{padding:4px 10px;border:1px solid var(--line);background:var(--bg);border-radius:4px;font-family:var(--ff);font-size:12px;cursor:pointer}
        .szs button.no{opacity:.4;cursor:not-allowed}

        .brgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
        .brgrid a{display:flex;align-items:center;justify-content:center;padding:20px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;transition:all .3s}
        .brgrid a:hover{border-color:var(--graphite);transform:translateY(-2px)}

        .cookie-banner{position:fixed;bottom:20px;left:20px;right:20px;max-width:400px;background:var(--graphite);color:#fff;padding:16px 20px;border-radius:12px;font-size:14px;z-index:90;display:none}
        .cookie-banner.on{display:block}
        .cookie-banner button{margin-top:12px;padding:8px 16px;background:#fff;color:var(--graphite);border:none;border-radius:6px;font-family:var(--ff);font-weight:600;cursor:pointer}

        footer{border-top:1px solid var(--line);margin-top:44px;padding:30px 0 calc(34px + var(--sb));font-size:13px}
        .fg{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1200px;margin:0 auto;padding:0 20px}
        footer b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:11px}
        footer a,footer p{display:block;color:var(--muted);margin-bottom:8px}
        footer a:hover{color:var(--graphite)}
        .footer-bottom{max-width:1200px;margin:20px auto 0;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:#888;text-align:center}
        @media(min-width:900px){.fg{grid-template-columns:repeat(4,1fr)}}

        .toast{
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(60px);
            background:var(--graphite); color:#fff; padding:12px 20px; border-radius:8px;
            font-size:14px; z-index:200; opacity:0; transition:all .3s ease;
            max-width:90%;
        }
        .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

        @media(min-width:900px){
            .mscroll{max-width:760px;margin:0 auto;width:100%}
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="hero">
            <div class="slides" id="slides">
                <div class="slide">Новая коллекция Miss Sixty</div>
                <div class="slide">Diesel — осень 2026</div>
                <div class="slide">Распродажа до -50%</div>
            </div>
            <div class="dots" id="dots"></div>
        </section>

        <div class="gender-toggle">
            <button class="on" onclick="setGender('women',this)">Женское</button>
            <button onclick="setGender('men',this)">Мужское</button>
        </div>

        <section class="section">
            <h2>Miss Sixty</h2>
            <div class="grid" id="g1"></div>
        </section>

        <section class="section">
            <h2>Diesel</h2>
            <div class="grid" id="g2"></div>
        </section>

        <section class="section">
            <h2>Бренды</h2>
            <div class="brgrid" id="brg"></div>
        </section>
    </main>

    <div class="cookie-banner" id="cookieBanner">
        Мы используем cookies для улучшения работы сайта.
        <br>
        <button onclick="acceptCookies()">Принять</button>
    </div>

    <div id="footer-placeholder"></div>

    <div class="toast" id="toast"></div>

    <script>
    async function loadPartials() {
        try {
            const [headerRes, footerRes] = await Promise.all([
                fetch('header.html'),
                fetch('footer.html')
            ]);
            if (!headerRes.ok || !footerRes.ok) throw new Error('Файлы не найдены');
            document.getElementById('header-placeholder').innerHTML = await headerRes.text();
            document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
            initAfterLoad();
        } catch (e) {
            console.error('Ошибка загрузки:', e);
        }
    }

    const MS=[
        {b:'MISS SIXTY',n:'Блуза-халтер из хлопка',pr:18990,old:0,sz:[['XS',1],['S',1],['M',1],['L',0]],lab:'Новинка'},
        {b:'MISS SIXTY',n:'Лонгслив с принтом «Русалка»',pr:28990,old:0,sz:[['XS',1],['S',1],['M',1]],lab:'Новинка'},
        {b:'MISS SIXTY',n:'Сумка-хобо с тиснением',pr:44990,old:0,sz:[['One size',1]],lab:''},
        {b:'MISS SIXTY',n:'Ремень кожаный с металлическим лого',pr:21990,old:0,sz:[['80',1],['85',1],['90',0]],lab:''}
    ];
    const DS=[
        {b:'DIESEL',n:'Джинсы D-Jet',pr:24990,old:0,sz:[['28',1],['30',1],['32',1],['34',0]],lab:''},
        {b:'DIESEL',n:'Куртка-косуха',pr:38500,old:0,sz:[['S',1],['M',1],['L',1]],lab:'Новинка'},
        {b:'DIESEL',n:'Футболка с лого',pr:8900,old:0,sz:[['S',1],['M',1],['L',1],['XL',1]],lab:''},
        {b:'DIESEL',n:'Сумка через плечо',pr:19900,old:0,sz:[['ONE',1]],lab:''}
    ];
    const BRANDS = ['Balmain','Bottega Veneta','Burberry','Chloé','Diesel','Gucci','Prada','Saint Laurent','Brunello Cucinelli','TOTEME','Santoni','Marni','Moschino','Giorgio Armani','BOSS','Brioni'];

    function card(p){
        return `<div class="card">
            <div class="pic"><div style="width:100%;height:100%;background:var(--soft)"></div></div>
            <div class="card-info">
                <div class="card-name">${p.n}</div>
                <div class="card-price">${p.pr.toLocaleString('ru-RU')} ₽</div>
                <div class="szs">${p.sz.map(s=>`<button class="${s[1]?'':'no'}" onclick="${s[1]?`add('${p.n.replace(/'/g,"")}','${s[0]}')`:`toast('Размер закончился')`}">${s[0]}</button>`).join('')}</div>
            </div>
        </div>`;
    }

    document.getElementById('g1').innerHTML = MS.map(card).join('');
    document.getElementById('g2').innerHTML = DS.map(card).join('');
    document.getElementById('brg').innerHTML = BRANDS.map(b=>`<a href="#" onclick="toast('Страница бренда ${b}');return false">${b}</a>`).join('');

    function openMenu(){
        const m=document.getElementById('menu'), o=document.getElementById('menuOverlay');
        if(m) m.classList.add('on');
        if(o) o.classList.add('on');
        document.body.style.overflow='hidden';
    }
    function closeMenu(){
        const m=document.getElementById('menu'), o=document.getElementById('menuOverlay');
        if(m) m.classList.remove('on');
        if(o) o.classList.remove('on');
        document.body.style.overflow='';
    }
    function toast(msg){
        const t=document.getElementById('toast');
        if(!t) return;
        t.textContent=msg;
        t.classList.add('on');
        setTimeout(()=>t.classList.remove('on'),2000);
    }
    function add(name,size){toast(`Добавлено: ${name}, размер ${size}`)}
    function setGender(g,btn){
        document.querySelectorAll('.gender-toggle button').forEach(b=>b.classList.remove('on'));
        btn.classList.add('on');
        toast(g==='women'?'Женское':'Мужское');
    }
    function acceptCookies(){document.getElementById('cookieBanner').classList.remove('on')}

    (function(){
        const slides=document.getElementById('slides');
        const dotsWrap=document.getElementById('dots');
        if(!slides) return;
        const count=slides.children.length;
        let idx=0;
        for(let i=0;i<count;i++){
            const d=document.createElement('button');
            d.className='dot'+(i===0?' on':'');
            d.onclick=()=>go(i);
            dotsWrap.appendChild(d);
        }
        function go(i){
            idx=i;
            slides.style.transform=`translateX(-${i*100}%)`;
            dotsWrap.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===i));
        }
        setInterval(()=>go((idx+1)%count),5000);
    })();

    if(!localStorage.getItem('cookies')){
        document.getElementById('cookieBanner').classList.add('on');
    }

    function initAfterLoad(){
        const header=document.querySelector('header');
        if(header){
            let lastY=0;
            window.addEventListener('scroll',()=>{
                const y=window.scrollY;
                if(y>lastY && y>80) header.classList.add('hidden');
                else if(y<lastY) header.classList.remove('hidden');
                if(y<=0) header.classList.remove('hidden');
                lastY=y;
            },{passive:true});
        }
    }

    loadPartials();
    </script>
</body>
</html>
